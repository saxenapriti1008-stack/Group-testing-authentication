services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend

    ports:
      - "4000:4000"

    volumes:
      - ./backend:/app
      - /app/node_modules

    environment:
      PORT: 4000
      CLIENT_ORIGIN: http://localhost:5173

    command: npm start

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: frontend

    ports:
      - "5173:5173"

    volumes:
      - ./client:/app
      - /app/node_modules

    environment:
      VITE_API_URL: http://localhost:4000

    command: npm run dev

    depends_on:
      - backend